
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">

  <defs>
    <!-- Outer Box Gradient -->
    <linearGradient id="outerGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#163A5E"></stop>
      <stop offset="100%" stop-color="#253B6E"></stop>
    </linearGradient>

    <!-- Inner Box Color -->
    <linearGradient id="innerGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A446C"></stop>
      <stop offset="100%" stop-color="#1A446C" stop-opacity="0.9"></stop>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"></feGaussianBlur>
      <feOffset dx="0" dy="12"></feOffset>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"></feFuncA>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Box -->
  <rect x="0" y="0" width="112" height="112" rx="28" fill="url(#outerGradient)" filter="url(#shadow)"></rect>

  <!-- Inner Box -->
  <rect x="4" y="4" width="104" height="104" rx="24" fill="#1A446C" fill-opacity="0.9"></rect>

  <!-- Shield Logo -->
  <g transform="translate(24 24)">

    <!-- Shield Path -->
    <path d="
      M 32 5.12
      L 12.8 14.08
      L 12.8 28.8
      C 12.8 44.8 22.4 54.4 32 60.16
      C 41.6 54.4 51.2 44.8 51.2 28.8
      L 51.2 14.08
      Z" fill="#1891AC" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"></path>

    <!-- Signal Beacon Waves -->
    <path d="M 21.76 33.28
             A 10.24 10.24 0 0 1 42.24 33.28" fill="none" stroke="#D2ECF9" stroke-width="2.5" stroke-linecap="round"></path>

    <!-- Core Pillar -->
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">

      <line x1="32" y1="28.16" x2="32" y2="42.24"></line>

      <line x1="26.88" y1="35.2" x2="37.12" y2="35.2"></line>
    </g>

    <!-- Bottom Node -->
    <circle cx="32" cy="46.08" r="3" fill="#D2ECF9"></circle>

  </g>
</svg>
