name: pantaura
description: "Aplikasi Respon Tanggap Bencana dan Pemulihan Warga."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  material_ui: ^1.11.1
  riverpod_lint: ^3.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
