name: pantaura
description: "Aplikasi Respon Tanggap Bencana dan Pemulihan Warga."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_image_compress_lite: ^3.0.1
  flutter_osm_plugin: ^4.1.0
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.5.0
  geolocator: ^14.1.2
  go_router: ^18.1.4
  image_picker: ^1.2.4
  material_ui: ^1.11.1
  permission_handler: ^13.0.2
  riverpod_lint: ^3.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700
    - family: Plus Jakarta Sans
      fonts:
        - asset: fonts/Plus_Jakarta_Sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: fonts/Plus_Jakarta_Sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: fonts/Plus_Jakarta_Sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: fonts/Plus_Jakarta_Sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: fonts/Plus_Jakarta_Sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
